# ==============================================================================
#  belt — workspace manifest
#
#  Fast, single-purpose Rust binaries that automate day-to-day developer
#  workflows. Primary target is macOS Apple Silicon, but the workspace is
#  std-only and builds/tests clean on Linux and Windows too (CI runs all). Each tool is
#  its own crate under `crates/` and depends on `local-common` for shared
#  plumbing (paths, terminal helpers, …). See README.md for the vision and
#  how to add a new tool.
# ==============================================================================

[workspace]
resolver = "2"
members = [
    "crates/local-common",
    "crates/scaffold",
    "crates/portkill",
    "crates/jwt",
    "crates/devclean",
    "crates/fanout",
    "crates/webdriver",
]
default-members = [
    "crates/local-common",
    "crates/scaffold",
    "crates/portkill",
    "crates/jwt",
    "crates/devclean",
    "crates/fanout",
    "crates/webdriver",
]

# Inherited by every crate via `version.workspace = true`, etc.
[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Alan R. Soares"]
license = "MIT"
publish = false
repository = "https://github.com/alanrsoares/belt"

# Dependencies shared across tools. A crate opts in with:
#   [dependencies]
#   clap = { workspace = true }
[workspace.dependencies]

# Workspace-wide lints, inherited by every crate that sets `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
